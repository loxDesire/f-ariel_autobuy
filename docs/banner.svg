<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="1" stop-color="#171b36"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc4dc"/>
      <stop offset="0.45" stop-color="#ffa6c9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffa6c9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffa6c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <ellipse cx="600" cy="140" rx="460" ry="150" fill="url(#glow)"/>

  <!-- лепестки -->
  <g fill="#ffa6c9">
    <circle cx="110" cy="70" r="6" opacity="0.55"/>
    <circle cx="160" cy="215" r="4" opacity="0.35"/>
    <circle cx="1060" cy="85" r="5" opacity="0.45"/>
    <circle cx="1110" cy="225" r="7" opacity="0.30"/>
    <circle cx="980" cy="250" r="3" opacity="0.40"/>
    <circle cx="230" cy="40" r="3" opacity="0.40"/>
  </g>
  <g fill="#a5b4fc">
    <circle cx="70" cy="160" r="4" opacity="0.40"/>
    <circle cx="1140" cy="150" r="4" opacity="0.40"/>
    <circle cx="215" cy="278" r="5" opacity="0.25"/>
  </g>

  <text x="600" y="160" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="112" font-weight="800" letter-spacing="10" fill="url(#title)">ARIELBOT</text>
  <text x="600" y="212" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" fill="#8a90c0">быстрая покупка лимитированных игрушек на f-ariel.ru</text>
  <text x="600" y="256" text-anchor="middle"
        font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="18" fill="#5a6190">несколько аккаунтов · терминальный интерфейс · Telegram</text>
</svg>
